name: Feature request
description: Propose an improvement within the project's scope
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What problem does the current scoring, sound, or video workflow create?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Logic Video Cue address this problem?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround do you use now, and why is it insufficient?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request directly concerns Logic Pro, multi-video cues, synchronization, or video-output workflows.
          required: true
