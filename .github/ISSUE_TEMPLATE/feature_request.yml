name: Feature request
description: 提出符合專案範圍的功能建議
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: 目前的配樂、音效或影片工作流程遇到什麼問題？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: 希望 Logic Video Cue 如何處理？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: 目前使用什麼替代方式？為什麼不夠？

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: 此功能與 Logic、多影片 Cue、同步或輸出工作流程直接相關。
          required: true
