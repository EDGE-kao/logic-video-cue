name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload client media, commercial Logic projects, private paths, or other confidential material.

  - type: input
    id: version
    attributes:
      label: Logic Video Cue version
      placeholder: v0.5.0 Build 10
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Logic Pro, Xcode, and Mac model/chip
      placeholder: macOS 15.x, Logic Pro 11.x, Xcode 16.x, Apple Silicon
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Reference media
      description: Format, codec, resolution, frame rate, and whether it contains audio
      placeholder: MOV, ProRes Proxy, 1920x1080, 29.97 fps, audio muted
    validations:
      required: true

  - type: textarea
    id: sync
    attributes:
      label: Logic sync settings
      description: MTC, MMC, Sync Mode, and Project Frame Rate
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reliable reproduction steps
      placeholder: |
        1. Launch Logic Video Cue
        2. Open Logic project
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed client content, private filenames, usernames, and local filesystem paths.
          required: true
